services:
  bhoot-fm-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bhoot-fm-web-dev
    ports:
      - "8080:3000"
    volumes:
      - node_modules:/app/node_modules
      - next:/app/.next
      - ./:/app:ro
    environment:
      INITIAL_DATE: "2014-01-03"

volumes:
  node_modules:
    name: bhoot-fm-node-modules
  next:
    name: bhoot-fm-next-folder
